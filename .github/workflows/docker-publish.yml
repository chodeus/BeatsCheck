name: "Docker Build & Publish"

# Builds on main, v* tags and every PR (PRs never push; the scan legs run once lint and test pass);
# workflow_dispatch is what image-refresh.yml sends on package drift.

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: docker-build-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-number:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.count.outputs.number }}
      date: ${{ steps.count.outputs.date }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: count
        run: |
          {
            echo "number=$(git rev-list --count HEAD)"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

  # Gate the image build/publish on lint + smoke tests so a broken push to
  # main can't publish :latest. (CodeQL runs in its own workflow; enforce it
  # as a required status check via branch protection.)
  lint:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install flake8
        run: pip install flake8
      - name: Syntax errors and undefined names
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Style warnings
        run: flake8 . --count --max-complexity=25 --max-line-length=127 --statistics

  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pytest
        run: pip install pytest
      - name: Smoke tests
        run: python -m pytest tests/ -q
      - name: JS syntax check
        run: node --check app/static/app.js

  build:
    needs: [build-number, lint, test]
    # The union the called workflow's jobs declare: checkout, the GHCR push,
    # and the Trivy SARIF upload. A called workflow can only reduce these.
    permissions:
      contents: read
      packages: write
      security-events: write
    uses: chodeus/chodeus-ops/.github/workflows/docker-build.yml@c36f1a3c7e8108f86b3be0e19c5e0d08502f681f # main
    with:
      push: ${{ github.event_name != 'pull_request' }}
      # Start the image on each platform and wait for its HEALTHCHECK before pushing.
      smoke_healthcheck: true
      build_args: |
        BUILD_DATE=${{ needs.build-number.outputs.date }}
        VCS_REF=${{ github.sha }}
        VERSION=${{ github.ref_name }}
        BUILD_NUMBER=${{ needs.build-number.outputs.number }}
    secrets: inherit

  notify-failure:
    needs: build
    # notify-discord.yml declares permissions: {} — it needs no scopes.
    permissions: {}
    if: failure() && github.event_name != 'pull_request'
    uses: chodeus/chodeus-ops/.github/workflows/notify-discord.yml@c36f1a3c7e8108f86b3be0e19c5e0d08502f681f # main
    with:
      event_type: build
      status: failure
      title: "❌ Docker build failed: ${{ github.ref_name }}"
      commit_sha: ${{ github.sha }}
    secrets: inherit
