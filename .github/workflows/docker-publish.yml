name: "Docker Build & Publish"

# Triggers:
#   push.branches.main → always build (cheap via GHA cache)
#   push.tags.v*       → always build (releases must produce tagged images)
#   pull_request       → build-only (no push) for Dockerfile/scripts/app changes
#   workflow_dispatch  → manual
#
# Note: GitHub Actions applies `on.push.paths` to the whole push event
# (branches AND tags), so a path-filtered tag push would silently skip
# release builds. We keep paths filtering on pull_request only.

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'scripts/**'
      - 'app/**'
  workflow_dispatch:

concurrency:
  group: docker-build-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  build-number:
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.count.outputs.number }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - id: count
        run: echo "number=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

  # Gate the image build/publish on lint + smoke tests so a broken push to
  # main can't publish :latest. (CodeQL runs in its own workflow; enforce it
  # as a required status check via branch protection.)
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install flake8
        run: pip install flake8
      - name: Syntax errors and undefined names
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Style warnings
        run: flake8 . --count --max-complexity=25 --max-line-length=127 --statistics

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install pytest
        run: pip install pytest
      - name: Smoke tests
        run: python -m pytest tests/ -q
      - name: JS syntax check
        run: node --check app/static/app.js

  build:
    needs: [build-number, lint, test]
    uses: chodeus/chodeus-ops/.github/workflows/docker-build.yml@2a3661ac2b92d2da482640228e5202486550656f # main
    with:
      push: ${{ github.event_name != 'pull_request' }}
      build_args: |
        BUILD_DATE=${{ github.event.head_commit.timestamp || github.event.pull_request.updated_at }}
        VCS_REF=${{ github.sha }}
        VERSION=${{ github.ref_name }}
        BUILD_NUMBER=${{ needs.build-number.outputs.number }}
    secrets: inherit

  notify-failure:
    needs: build
    if: failure() && github.event_name != 'pull_request'
    uses: chodeus/chodeus-ops/.github/workflows/notify-discord.yml@2a3661ac2b92d2da482640228e5202486550656f # main
    with:
      event_type: build
      status: failure
      title: "❌ Docker build failed: ${{ github.ref_name }}"
      commit_sha: ${{ github.sha }}
    secrets: inherit
