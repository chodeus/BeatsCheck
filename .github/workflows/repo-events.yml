# Discord posts for issues, PRs, discussions and manually published releases.
# release-please's releases post from release-please.yml: GITHUB_TOKEN events start no workflow.

name: Repo events

on:
  issues:
    types: [opened, closed, reopened]
  pull_request:
    types: [opened, closed, reopened, ready_for_review]
  release:
    types: [published]
  discussion:
    types: [created]

permissions:
  contents: read

jobs:
  notify:
    uses: chodeus/chodeus-ops/.github/workflows/repo-events.yml@6e15484f5348c9862408046b962fa7083ceeffeb # main
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
