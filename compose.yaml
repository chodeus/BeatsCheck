### BeatsCheck compose.yaml example: https://github.com/chodeus/BeatsCheck
### docker compose up -d, then `docker exec beatscheck rescan` or `docker exec -it beatscheck delete`.
services:
  beatscheck:
    image: ghcr.io/chodeus/beatscheck:latest
    container_name: beatscheck
    restart: unless-stopped
    volumes:
      ## Music/media library — same path you use in Lidarr/Sonarr.
      ## Mount read-only for report mode, rw for move or delete.
      - /mnt/user/data:/data:ro
      ## Persistent config: logs, corrupt.txt, tracking data
      - /path/to/config:/config
      ## Host timezone. A TZ variable below overrides it, so keep one or the other.
      - /etc/localtime:/etc/localtime:ro
    environment:
      ## Container user/group IDs and timezone
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      - UMASK=002
      ## Behind a reverse proxy: its own fixed IP, so each client gets its own login
      ## lockout. A shared subnet would trust every container on it.
      # - WEBUI_TRUSTED_PROXIES=172.18.0.10
      ## All other settings (mode, workers, Lidarr, etc.) are configured in
      ## /config/beatscheck.conf — auto-created on first run.
    ## WebUI: uncomment, and set webui = true in /config/beatscheck.conf.
    ## Never expose the port to the internet; for remote access, use an HTTPS reverse proxy with authentication.
    # ports:
    #   - "8484:8484"
    ## Optional: limit CPU usage to avoid impacting other services
    # cpus: 2
    ## Optional hardening: only the five capabilities the entrypoint needs
    ## (PUID/PGID remap, chown, su-exec), and no setuid escalation.
    # cap_drop:
    #   - ALL
    # cap_add:
    #   - CHOWN
    #   - SETUID
    #   - SETGID
    #   - FOWNER
    #   - DAC_OVERRIDE
    # security_opt:
    #   - no-new-privileges:true
    ## Fully rootless: replace PUID/PGID with `user:` and pre-chown the config dir
    ## (sudo chown -R 99:100 /path/to/config); the entrypoint then skips chown and su-exec.
    # user: "99:100"
